<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" fill="none" font-family="ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif">
  <defs>
    <linearGradient id="loop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6b6b"/><stop offset=".5" stop-color="#bd34fe"/><stop offset="1" stop-color="#41d1ff"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d1d31"/><stop offset="1" stop-color="#14141f"/>
    </linearGradient>
    <linearGradient id="codebar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#211d3a"/><stop offset="1" stop-color="#1a2236"/>
    </linearGradient>
    <linearGradient id="corebar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#241b3d"/><stop offset=".5" stop-color="#1b2440"/><stop offset="1" stop-color="#1a1f3a"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <!-- ─────────── single codebase ─────────── -->
  <g filter="url(#soft)">
    <rect x="190" y="28" width="580" height="58" rx="15" fill="url(#codebar)" stroke="#3a3a59" stroke-width="1.5"/>
  </g>
  <rect x="190" y="28" width="6" height="58" rx="3" fill="url(#loop)"/>
  <text x="220" y="54" fill="#f1f1f8" font-size="15" font-weight="700">Single codebase</text>
  <text x="220" y="74" fill="#8585a3" font-size="11.5">shared /apps &amp; framework /packages — one deploy reaches every tenant</text>
  <g font-family="ui-monospace,monospace" font-size="11" fill="#9a9ac0">
    <rect x="590" y="42" width="64" height="20" rx="6" fill="#23233a"/><text x="600" y="56">/apps</text>
    <rect x="662" y="42" width="96" height="20" rx="6" fill="#23233a"/><text x="672" y="56">/packages</text>
  </g>

  <!-- codebase → core -->
  <g stroke="#4d4d72" stroke-width="2" fill="none"><path d="M480 86 L480 118"/></g>

  <!-- ─────────── the core (generator) ─────────── -->
  <g filter="url(#soft)">
    <rect x="150" y="118" width="660" height="96" rx="16" fill="url(#corebar)" stroke="url(#loop)" stroke-width="2"/>
  </g>
  <rect x="150" y="118" width="6" height="96" rx="3" fill="url(#loop)"/>
  <text x="182" y="150" fill="#f1f1f8" font-size="16" font-weight="700">Loopar Core</text>
  <rect x="300" y="136" width="80" height="20" rx="10" fill="#2a2150" stroke="url(#loop)"/><text x="312" y="150" fill="#c9b6ff" font-size="10" font-weight="600">generator</text>
  <g font-family="ui-monospace,monospace"><rect x="690" y="134" width="64" height="22" rx="6" fill="#23233a"/><text x="702" y="149" fill="#9a9ac0" font-size="11">:3000</text></g>
  <text x="182" y="174" fill="#8585a3" font-size="11.5">one Node process · owns the HTTP server · tenant-less — routes each request to its tenant by Host</text>
  <g font-family="ui-monospace,monospace" font-size="10" fill="#9a9ac0">
    <rect x="182" y="188" width="92" height="18" rx="6" fill="#23233a"/><text x="192" y="201">HTTP + Vite</text>
    <rect x="284" y="188" width="66" height="18" rx="6" fill="#23233a"/><text x="294" y="201">realtime</text>
    <rect x="360" y="188" width="112" height="18" rx="6" fill="#23233a"/><text x="370" y="201">tenant resolver</text>
  </g>

  <!-- core → tenants (they plug into the core) -->
  <g stroke="#4d4d72" stroke-width="2" fill="none">
    <path d="M480 214 C 480 236, 228 232, 228 254"/>
    <path d="M480 214 L480 254"/>
    <path d="M480 214 C 480 236, 732 232, 732 254"/>
  </g>

  <!-- ─────────── tenant cards ─────────── -->
  <!-- dev / admin -->
  <g filter="url(#soft)"><rect x="120" y="254" width="216" height="168" rx="15" fill="url(#panel)" stroke="url(#loop)" stroke-width="2"/></g>
  <text x="144" y="288" fill="#f1f1f8" font-size="15" font-weight="700">dev</text>
  <rect x="182" y="274" width="62" height="20" rx="10" fill="#2a2150" stroke="#6366f1"/><text x="193" y="288" fill="#a9a7ff" font-size="10" font-weight="600">admin</text>
  <text x="144" y="312" fill="#8585a3" font-size="11.5">control center · build &amp; manage</text>
  <g transform="translate(132,336)" stroke="#41d1ff" stroke-width="1.8" fill="none">
    <ellipse cx="10" cy="6" rx="10" ry="4"/><path d="M0 6 v16 a10 4 0 0 0 20 0 v-16"/><path d="M0 13 a10 4 0 0 0 20 0"/>
  </g>
  <text x="166" y="350" fill="#c7c7da" font-size="11.5">own database</text>
  <text x="144" y="382" fill="#7e7e9c" font-size="11">manages every tenant</text>
  <text x="144" y="408" fill="#7e7e9c" font-size="11">dev.localhost · local only</text>

  <!-- client-a / active -->
  <g filter="url(#soft)"><rect x="372" y="254" width="216" height="168" rx="15" fill="url(#panel)" stroke="#34344f" stroke-width="1.5"/></g>
  <text x="396" y="288" fill="#f1f1f8" font-size="15" font-weight="700">client-a</text>
  <rect x="476" y="274" width="60" height="20" rx="10" fill="#14352a" stroke="#10b981"/><text x="487" y="288" fill="#5ee0aa" font-size="10" font-weight="600">active</text>
  <text x="396" y="312" fill="#8585a3" font-size="11.5">isolated data &amp; users</text>
  <g transform="translate(384,336)" stroke="#41d1ff" stroke-width="1.8" fill="none">
    <ellipse cx="10" cy="6" rx="10" ry="4"/><path d="M0 6 v16 a10 4 0 0 0 20 0 v-16"/><path d="M0 13 a10 4 0 0 0 20 0"/>
  </g>
  <text x="418" y="350" fill="#c7c7da" font-size="11.5">own database</text>
  <text x="396" y="382" fill="#7e7e9c" font-size="11">own config &amp; theme</text>
  <text x="396" y="408" fill="#9a9ac0" font-size="11">acme.com · auto-SSL</text>

  <!-- client-b / suspended -->
  <g filter="url(#soft)"><rect x="624" y="254" width="216" height="168" rx="15" fill="url(#panel)" stroke="#34344f" stroke-width="1.5"/></g>
  <text x="648" y="288" fill="#b9b9cc" font-size="15" font-weight="700">client-b</text>
  <rect x="726" y="274" width="90" height="20" rx="10" fill="#2a2416" stroke="#b78a2e"/><text x="737" y="288" fill="#e0c164" font-size="10" font-weight="600">suspended</text>
  <text x="648" y="312" fill="#7e7e9c" font-size="11.5">off · serves the suspended page</text>
  <g transform="translate(636,336)" stroke="#6a6a86" stroke-width="1.8" fill="none">
    <ellipse cx="10" cy="6" rx="10" ry="4"/><path d="M0 6 v16 a10 4 0 0 0 20 0 v-16"/><path d="M0 13 a10 4 0 0 0 20 0"/>
  </g>
  <text x="670" y="350" fill="#8a8aa0" font-size="11.5">own database</text>
  <text x="648" y="382" fill="#6a6a86" font-size="11">config &amp; data preserved</text>
  <text x="648" y="408" fill="#7e7e9c" font-size="11">portal.io · auto-SSL</text>

  <!-- tenants → infra -->
  <g stroke="#4d4d72" stroke-width="2" fill="none">
    <path d="M228 422 L228 458"/><path d="M480 422 L480 458"/><path d="M732 422 L732 458"/>
  </g>

  <!-- ─────────── infra ─────────── -->
  <g filter="url(#soft)"><rect x="120" y="458" width="720" height="34" rx="10" fill="#17172b" stroke="#34344f" stroke-width="1.4"/></g>
  <circle cx="144" cy="475" r="7" fill="#6366f1"/><text x="160" y="479" fill="#dcdcec" font-size="12" font-weight="600">PM2</text>
  <text x="204" y="479" fill="#7e7e9c" font-size="11.5">— one core process (loopar-core) · every tenant runs in-process</text>
  <g filter="url(#soft)"><rect x="120" y="502" width="720" height="34" rx="10" fill="#17172b" stroke="#34344f" stroke-width="1.4"/></g>
  <circle cx="144" cy="519" r="7" fill="#41d1ff"/><text x="160" y="523" fill="#dcdcec" font-size="12" font-weight="600">Caddy</text>
  <text x="216" y="523" fill="#7e7e9c" font-size="11.5">— catch-all: every tenant domain → the core · automatic SSL</text>
</svg>
